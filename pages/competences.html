<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compétences - Portfolio Arena</title>
  <style>
    body {
      background-color: #f9f9f9; /* Fond clair */
      font-family: Arial, sans-serif;
      color: #1F1F1F; /* Texte principal foncé */
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 36px;
      color: #064635; /* Vert foncé pour accent */
    }

    .skills-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .skill-card {
      background-color: #e8f0e8; /* Vert très clair */
      border-radius: 15px;
      padding: 25px 20px;
      width: 220px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      transition: transform 0.3s, box-shadow 0.3s;
      border-top: 4px solid #064635; /* Accent vert foncé */
    }

    .skill-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    .skill-card h3 {
      margin-bottom: 12px;
      color: #064635; /* Vert foncé */
      font-size: 20px;
    }

    .skill-card p {
      font-size: 15px;
      line-height: 1.5;
      color: #1F1F1F; /* Texte noir foncé */
    }

    .btn-home {
      display: inline-block;
      margin-top: 40px;
      padding: 12px 30px;
      background-color: #064635; /* Vert foncé */
      color: #fff;
      font-weight: bold;
      text-decoration: none;
      border-radius: 30px;
      transition: 0.3s;
    }

    .btn-home:hover {
      background-color: #04603d;
      box-shadow: 0 6px 20px rgba(0,100,60,0.4);
      transform: translateY(-3px);
    }

    @media screen and (max-width: 600px) {
      .skills-container {
        flex-direction: column;
        align-items: center;
      }

      .skill-card {
        width: 90%;
      }
    }
  </style>
</head>
<body>
  <h1>Mes Compétences</h1>
  <div class="skills-container">
    <div class="skill-card">
      <h3>Développement Web</h3>
      <p>HTML, CSS, JavaScript, PHP, Bootstrap</p>
    </div>
    <div class="skill-card">
      <h3>Programmation</h3>
      <p>Python (bases), Java (en apprentissage)</p>
    </div>
    <div class="skill-card">
      <h3>Base de données</h3>
      <p>MySQL, gestion CRUD, MAMP</p>
    </div>
    <div class="skill-card">
      <h3>Outils</h3>
      <p>Git, GitHub, Vercel, VS Code</p>
    </div>
    <div class="skill-card">
      <h3>Design</h3>
      <p>Conception simple JavaFx, Scenebuilder</p>
    </div>
  </div>

  <center>
    <a href="../index.html" class="btn-home">Retour à l'accueil</a>
  </center>
</body>
</html>
